name: AI Analytics CI/CD Pipeline

on:
  push:
    branches: ["PreDeploy"]
  pull_request:
    branches: ["PreDeploy"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0"

      - name: Create .env File
        run: |
          touch .env
          echo "DB_USER=${{ secrets.DB_USER }}" >> .env
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> .env
          echo "DB_NAME=${{ secrets.DB_NAME }}" >> .env
          echo "ConnectionStrings__DefaultConnection=Host=db;Port=5432;Database=${{ secrets.DB_NAME }};Username=${{ secrets.DB_USER }};Password=${{ secrets.DB_PASSWORD }}" >> .env
      - name: Restore and Build
        run: |
          dotnet restore 
          dotnet build --configuration Release

      - name: Test Docker Compose Up
        run: |
          docker compose up -d
          echo "Waiting for services to stabilize..."
          sleep 30
          docker ps
          if [ $(docker ps -f status=exited -q | wc -l) -gt 0 ]; then
            echo "Error: One or more containers failed!"
            docker compose logs
            exit 1
          fi

      - name: Shutdown Test Environment
        run: docker compose down

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Presentation/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-frontend:${{ github.sha }}
