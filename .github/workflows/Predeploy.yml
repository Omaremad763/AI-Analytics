name: AI Analytics CI/CD Pipeline

on:
  push:
    branches: [ "live" ] # هيشتغل لما تعمل Merge أو Push على branch الـ live

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. إعداد الـ .NET للتأكد من سلامة الكود قبل بناء الدوكر
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0'

      - name: Restore and Build
        run: |
          dotnet restore "AI Analytics.sln"
          dotnet build "AI Analytics.sln" --configuration Release

      # 2. تسجيل الدخول إلى Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 3. بناء ورفع الـ Backend Image
      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          # تأكد من تعديل المسار لو اسم الفولدر عندك صح (Presentation)
          file: ./Presentation/Dockerfile 
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-backend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-backend:${{ github.sha }}

      # 4. بناء ورفع الـ Frontend Image
      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./Front
          file: ./Front/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-frontend:latest
            ${{ secrets.DOCKER_USERNAME }}/ai-analytics-frontend:${{ github.sha }}
